<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смена пароля — Hooky Checker</title><style>body{margin:0;background:#f3f6fc;color:#253674;font:15px Inter,system-ui}main{max-width:460px;margin:8vh auto;background:white;padding:32px;border-radius:16px}label{display:block;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #e4e8f1;border-radius:9px}button{width:100%;padding:11px;border:0;border-radius:9px;background:#3152d9;color:white}.error{color:#b42318}</style></head><body><main><a href="/">← Дашборд</a><h1>Смена пароля</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Текущий пароль<input type="password" name="current_password" required autocomplete="current-password"></label><label>Новый пароль<input type="password" name="new_password" minlength="10" required autocomplete="new-password"></label><button>Изменить пароль</button></form></main></body></html>
