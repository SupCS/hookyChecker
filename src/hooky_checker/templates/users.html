<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользователи — Hooky Checker</title><style>body{margin:0;background:#f3f6fc;color:#253674;font:15px Inter,system-ui}main{max-width:1250px;margin:auto;padding:28px}.card{background:white;padding:20px;border-radius:16px;margin:18px 0}input,select,button{padding:9px;border:1px solid #e4e8f1;border-radius:8px;background:white}form{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e4e8f1;text-align:left;vertical-align:top}.create input{flex:1;min-width:180px}.primary{background:#3152d9;color:white}.danger{color:#b42318}.inactive{opacity:.55}</style></head><body><main><a href="/">← Дашборд</a><h1>Пользователи</h1><form method="get"><input name="q" value="{{ q }}" placeholder="Поиск по имени или email"><button>Найти</button></form><section class="card"><h2>Добавить пользователя</h2><form class="create" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="email" name="email" placeholder="Email" required><input name="display_name" placeholder="Имя" required><input type="password" name="password" minlength="10" placeholder="Временный пароль (10+ символов)" required><button class="primary">Создать viewer</button></form></section><section class="card"><table><thead><tr><th>Пользователь</th><th>Последний вход</th><th>Роль и доступ</th><th>Сброс пароля</th></tr></thead><tbody>{% for user in users %}<tr class="{% if not user.is_active %}inactive{% endif %}"><td>{{ user.display_name }}<br><small>{{ user.email }}</small></td><td>{{ user.last_login_at or '—' }}</td><td>{% if user.role.value == 'admin' %}admin{% else %}<form method="post" action="/admin/users/{{ user.id }}/role"><input type="hidden" name="csrf" value="{{ csrf_token }}"><select name="role"><option value="viewer" {% if user.role.value == 'viewer' %}selected{% endif %}>viewer</option><option value="editor" {% if user.role.value == 'editor' %}selected{% endif %}>editor</option></select><button>Сохранить</button></form><form method="post" action="/admin/users/{{ user.id }}/active"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="active" value="{{ 'false' if user.is_active else 'true' }}"><button class="{% if user.is_active %}danger{% endif %}">{{ 'Отключить' if user.is_active else 'Включить' }}</button></form>{% endif %}</td><td><form method="post" action="/admin/users/{{ user.id }}/reset-password"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="password" name="new_password" minlength="10" placeholder="Новый временный пароль" required><button>Сбросить и завершить сессии</button></form></td></tr>{% endfor %}</tbody></table></section></main></body></html>
